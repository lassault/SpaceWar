<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space War</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
      color: #8af;
    }
    #game-wrapper {
      position: relative;
      /* Scale the 1300×720 canvas to fit the viewport while preserving ratio */
      max-width: 100vw;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
      border: 1px solid #333;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 1.2rem;
      gap: 16px;
    }
    #progress-bar-wrap {
      width: 300px;
      height: 12px;
      border: 1px solid #555;
      border-radius: 6px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #4af;
      width: 0%;
      transition: width 0.1s;
    }
    footer {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #555;
    }
    footer a { color: #8af; text-decoration: none; }
  </style>
</head>
<body>
  <h1>⭐ Space War ⭐</h1>

  <div id="game-wrapper">
    <canvas id="game-canvas" width="1300" height="720"></canvas>
    <div id="loading">
      <span id="loading-text">Loading assets…</span>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    </div>
  </div>

  <footer>
    Built with
    <a href="https://www.rust-lang.org/" target="_blank">Rust</a> +
    <a href="https://webassembly.org/" target="_blank">WebAssembly</a> ·
    Original Java version by
    <a href="https://github.com/lassault/SpaceWar" target="_blank">lassault</a>
  </footer>

  <script type="module">
    import init, { SpaceWarGame } from './pkg/spacewar_wasm.js';

    // ─── Image manifest ──────────────────────────────────────────────────────────
    // Order must match the IMG_* constants defined in src/lib.rs:
    //   0-2   estrella1-3
    //   3-7   enemigo01-05
    //   8-10  disparo1-3  (player bullets)
    //   11    disparo4    (enemy bullet)
    //   12    vida        (life icon)
    //  13-20  fuego1-8    (player thruster)
    //  21-28  fuegoenemigo1-8 (enemy thruster)
    //  29-35  explosion-01 … explosion-07
    //  36-99  nave[1..8]/nave[s]-[1..8].png  → ship (s-1)*8 + (f-1) + 36
    const ASSETS = (() => {
      const list = [];

      // Stars
      for (let i = 1; i <= 3; i++) list.push(`assets/estrellas/estrella${i}.png`);
      // Enemies
      for (let i = 1; i <= 5; i++) list.push(`assets/enemigos/enemigo0${i}.png`);
      // Player bullets
      for (let i = 1; i <= 3; i++) list.push(`assets/disparos/disparo${i}.png`);
      // Enemy bullet
      list.push('assets/disparos/disparo4.png');
      // Life icon
      list.push('assets/vidas/vida.png');
      // Player thruster frames
      for (let i = 1; i <= 8; i++) list.push(`assets/fuegotrasero/fuego${i}.png`);
      // Enemy thruster frames
      for (let i = 1; i <= 8; i++) list.push(`assets/fuegotrasero/fuegoenemigo${i}.png`);
      // Explosion frames
      for (let i = 1; i <= 7; i++) {
        const n = i < 10 ? `0${i}` : `${i}`;
        list.push(`assets/explosion/explosion-${n}.png`);
      }
      // Ships: 8 ships × 8 upgrade frames
      for (let s = 1; s <= 8; s++) {
        for (let f = 1; f <= 8; f++) {
          // ship s (1-based), upgrade frame f (1-based) → index 36 + (s-1)*8 + (f-1)
          list.push(`assets/nave${s}/nave${s}-${f}.png`);
        }
      }

      return list;
    })();

    // ─── Asset loader ─────────────────────────────────────────────────────────
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => {
          // Silently resolve with a blank image so one missing sprite
          // doesn't abort the entire game load.
          const blank = new Image();
          resolve(blank);
        };
        img.src = src;
      });
    }

    async function loadAllAssets() {
      const bar = document.getElementById('progress-bar');
      const txt = document.getElementById('loading-text');
      const total = ASSETS.length;
      let done = 0;

      const images = await Promise.all(
        ASSETS.map(src =>
          loadImage(src).then(img => {
            done++;
            bar.style.width = `${(done / total) * 100}%`;
            return img;
          })
        )
      );

      txt.textContent = 'Starting game…';
      return images;
    }

    // ─── Main ─────────────────────────────────────────────────────────────────
    async function main() {
      await init();   // initialise the WASM module

      const images = await loadAllAssets();

      const canvas = document.getElementById('game-canvas');
      const game = new SpaceWarGame(canvas, images);

      // Hide loading overlay
      document.getElementById('loading').style.display = 'none';
      canvas.focus();

      // Input: keyboard
      document.addEventListener('keydown', e => {
        // Prevent spacebar from scrolling the page
        if (e.key === ' ') e.preventDefault();
        game.on_key_down(e.key, e.keyCode);
      });

      // Input: mouse (canvas-relative coordinates)
      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        // Scale from CSS pixels back to the logical 1300×720 canvas space
        const scaleX = 1300 / rect.width;
        const scaleY = 720  / rect.height;
        game.on_mouse_move(
          (e.clientX - rect.left) * scaleX,
          (e.clientY - rect.top)  * scaleY
        );
      });

      // Touch support: map single-finger drag to mouse position and tap to fire
      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = 1300 / rect.width;
        const scaleY = 720  / rect.height;
        game.on_mouse_move(
          (touch.clientX - rect.left) * scaleX,
          (touch.clientY - rect.top)  * scaleY
        );
      }, { passive: false });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        game.on_key_down(' ', 32);   // fire on tap
      }, { passive: false });

      // Game loop
      function loop(ts) {
        game.tick(ts);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    main().catch(console.error);
  </script>
</body>
</html>
